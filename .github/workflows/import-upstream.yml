name: Import upstream source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-upstream.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          path: destination
          fetch-depth: 0
      - name: Checkout public upstream
        uses: actions/checkout@v4
        with:
          repository: techy09-creator/LastWave-Native
          ref: main
          path: upstream
          fetch-depth: 1
      - name: Copy complete upstream tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' upstream/ destination/
          cd destination
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import upstream LastWave-Native source"
          git push origin HEAD:main
